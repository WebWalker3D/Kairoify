[versions]
agp = "9.5.2"
kotlin = "2.4.21"
composeBom = "2026.11.01"
media3 = "1.11.1"
okhttp = "5.5.1"
serialization = "1.13.0"
coroutines = "1.11.0"
coil = "3.6.3"
navigation = "2.10.2"
lifecycle = "2.11.1"
activity = "1.13.0"
coreKtx = "1.19.1"
junit = "4.13.2"
robolectric = "4.18.1"
licensee = "1.14.1"
spotless = "8.12.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
